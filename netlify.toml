[build]
  command       = "npm run build"
  publish       = "dist"

# SPA fallback — send all routes to index.html so React Router works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Cache headers ────────────────────────────────────────────────────────────
# Vite outputs content-hashed filenames for JS/CSS (e.g. index-SQ4Of4Cr.js)
# so it is safe to cache them in browsers for 1 year.
# Returning visitors download ZERO bytes from Netlify — the browser uses its
# local cache. Only index.html (0.5 KB) is re-fetched to check for updates.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
